[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-terminal"
version = "0.1.0"
description = "Jailed terminal CLI for agent computer-use (policy + driver)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agents-terminal = "agents_terminal.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
